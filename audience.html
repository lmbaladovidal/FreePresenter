<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ProPresenter AI Studio - Salida Principal (Audiencia / Stream)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #000;
      color: #fff;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .bg-media-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      opacity: 0;
      pointer-events: none;
    }

    #bg-fallback {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #1e293b 0%, #090d16 100%);
      z-index: 0;
    }

    #slide-text-container {
      position: relative;
      z-index: 2;
      max-width: 85%;
      text-align: center;
      font-size: 3.8rem;
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: -1px;
      color: #ffffff;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.9), 0 2px 4px rgba(0, 0, 0, 0.8);
      white-space: pre-wrap;
      transition: opacity 0.25s ease, transform 0.25s ease;
    }

    #slide-text-container.cleared {
      opacity: 0;
      transform: scale(0.98);
    }

    .slide-scripture-ref {
      display: block;
      font-size: 0.52em;
      font-weight: 700;
      color: #38bdf8;
      font-style: italic;
      margin-top: 14px;
      line-height: 1.3;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
    }

    /* Lower Third Overlay Banner */
    #lower-third-banner {
      position: absolute;
      bottom: 40px;
      left: 60px;
      z-index: 3;
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.9), rgba(30, 41, 59, 0.9));
      border-left: 6px solid #3b82f6;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      border-right: 1px solid rgba(255, 255, 255, 0.15);
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      padding: 16px 28px;
      border-radius: 0 12px 12px 0;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.7), 0 0 15px rgba(59, 130, 246, 0.3);
      backdrop-filter: blur(12px);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      transform: translateX(-120%);
      opacity: 0;
    }

    #lower-third-banner.active {
      transform: translateX(0);
      opacity: 1;
    }

    #lower-third-title {
      font-size: 1.6rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 4px;
    }

    #lower-third-subtitle {
      font-size: 1rem;
      font-weight: 600;
      color: #93c5fd;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div id="bg-fallback"></div>
  
  <!-- Dual Layer Media for Smooth Crossfade Transitions (Video & Image Support) -->
  <video id="bg-video-a" class="bg-media-layer" autoplay loop muted playsinline></video>
  <video id="bg-video-b" class="bg-media-layer" autoplay loop muted playsinline></video>
  <img id="bg-img-a" class="bg-media-layer" style="display:none;" />
  <img id="bg-img-b" class="bg-media-layer" style="display:none;" />
  
  <div id="slide-text-container"></div>

  <div id="lower-third-banner">
    <div id="lower-third-title">--</div>
    <div id="lower-third-subtitle">--</div>
  </div>

  <script type="module">
    import { BroadcastSync } from './src/js/broadcast.js';

    const sync = new BroadcastSync(false);
    const bgVideoA = document.getElementById('bg-video-a');
    const bgVideoB = document.getElementById('bg-video-b');
    const bgImgA = document.getElementById('bg-img-a');
    const bgImgB = document.getElementById('bg-img-b');
    const textEl = document.getElementById('slide-text-container');
    const ltBanner = document.getElementById('lower-third-banner');
    const ltTitle = document.getElementById('lower-third-title');
    const ltSub = document.getElementById('lower-third-subtitle');

    let currentVideoUrl = "";
    let currentLiveText = "";
    let activeMediaLayer = 'A'; // 'A' or 'B'
    let fadeTimeout = null;

    sync.onUpdate((state) => {
      // 0. Active Template Typography & Layout Styles
      if (state.activeTemplate) {
        const tpl = state.activeTemplate;
        textEl.style.fontFamily = tpl.fontFamily || 'Inter, sans-serif';
        textEl.style.fontSize = (tpl.fontSize || 52) + 'px';
        textEl.style.letterSpacing = (tpl.letterSpacing || 0) + 'px';
        textEl.style.lineHeight = tpl.lineHeight || 1.25;
        textEl.style.color = tpl.color || '#ffffff';
        textEl.style.textShadow = tpl.textShadow || '0 4px 16px rgba(0,0,0,0.8)';
        textEl.style.textAlign = tpl.textAlign || 'center';
        textEl.style.backgroundColor = tpl.bgColor || 'transparent';
        textEl.style.padding = (tpl.padding || 0) + 'px';
        textEl.style.borderRadius = (tpl.borderRadius || 0) + 'px';
        
        // Vertical Position Y
        textEl.style.position = 'absolute';
        textEl.style.left = '5%';
        textEl.style.right = '5%';
        textEl.style.top = (tpl.posY || 50) + '%';
        textEl.style.transform = 'translateY(-50%)';

        // Max lines clamp
        if (tpl.maxLines && tpl.maxLines > 0) {
          textEl.style.display = '-webkit-box';
          textEl.style['-webkit-line-clamp'] = tpl.maxLines;
          textEl.style['-webkit-box-orient'] = 'vertical';
          textEl.style.overflow = 'hidden';
        } else {
          textEl.style.display = 'block';
          textEl.style.overflow = 'visible';
        }
      }

      const dur = state.fadeDuration || 250;
      const halfDur = Math.round(dur * 0.48);

      // Configure Transition Timing (Cut vs Fade with dynamic duration 100ms-1000ms)
      if (state.textTransition === 'cut') {
        textEl.style.transition = 'opacity 0s, transform 0s';
      } else {
        textEl.style.transition = `opacity ${halfDur}ms ease-in-out, transform ${halfDur}ms ease-in-out`;
      }

      // 1. Text Layer (with slide-to-slide crossfade animation)
      const targetText = (state.isTextCleared || !state.liveText) ? "" : state.liveText;

      if (!targetText) {
        textEl.classList.add('cleared');
        textEl.style.opacity = '0';
        currentLiveText = "";
      } else if (targetText !== currentLiveText) {
        const formattedHTML = targetText.replace(/\n/g, '<br/>');

        if (state.textTransition === 'fade' && currentLiveText && !textEl.classList.contains('cleared')) {
          // Slide-to-slide crossfade: Fade out halfDur -> Swap text -> Fade in
          textEl.style.opacity = '0';
          if (fadeTimeout) clearTimeout(fadeTimeout);
          fadeTimeout = setTimeout(() => {
            textEl.innerHTML = formattedHTML;
            textEl.classList.remove('cleared');
            textEl.style.opacity = '1';
          }, halfDur);
        } else {
          // Immediate swap for 'cut' mode or first slide
          if (fadeTimeout) clearTimeout(fadeTimeout);
          textEl.innerHTML = formattedHTML;
          textEl.classList.remove('cleared');
          textEl.style.opacity = '1';
        }
        currentLiveText = targetText;
      }

      // 2. Video / Media Background Layer (Dual Layer Crossfade for Videos & Images)
      const mediaMode = state.mediaTransition || 'fade';

      function isMediaImage(url, type = "") {
        if (type && type.startsWith('image/')) return true;
        if (type && type.startsWith('video/')) return false;
        if (!url) return false;
        return !!url.match(/\.(jpeg|jpg|gif|png|webp|svg|bmp)($|\?)/i) || url.startsWith('data:image/');
      }

      if (state.isMediaCleared || !state.activeVideoUrl) {
        if (mediaMode === 'cut') {
          bgVideoA.style.transition = 'opacity 0s';
          bgVideoB.style.transition = 'opacity 0s';
          bgImgA.style.transition = 'opacity 0s';
          bgImgB.style.transition = 'opacity 0s';
        } else {
          bgVideoA.style.transition = `opacity ${dur}ms ease-in-out`;
          bgVideoB.style.transition = `opacity ${dur}ms ease-in-out`;
          bgImgA.style.transition = `opacity ${dur}ms ease-in-out`;
          bgImgB.style.transition = `opacity ${dur}ms ease-in-out`;
        }
        bgVideoA.style.opacity = '0';
        bgVideoB.style.opacity = '0';
        bgImgA.style.opacity = '0';
        bgImgB.style.opacity = '0';
        bgVideoA.pause();
        bgVideoB.pause();
        currentVideoUrl = "";
      } else if (currentVideoUrl !== state.activeVideoUrl) {
        currentVideoUrl = state.activeVideoUrl;

        const isImage = (state.activeVideoType && state.activeVideoType.startsWith('image/')) || (state.activeVideoIsImage && !state.activeVideoType?.startsWith('video/')) || isMediaImage(currentVideoUrl, state.activeVideoType);

        const incomingMedia = activeMediaLayer === 'A' ? { video: bgVideoB, img: bgImgB } : { video: bgVideoA, img: bgImgA };
        const outgoingMedia = activeMediaLayer === 'A' ? { video: bgVideoA, img: bgImgA } : { video: bgVideoB, img: bgImgB };
        activeMediaLayer = activeMediaLayer === 'A' ? 'B' : 'A';

        const incomingEl = isImage ? incomingMedia.img : incomingMedia.video;
        const outgoingEl = outgoingMedia.video.style.opacity > 0 ? outgoingMedia.video : outgoingMedia.img;

        if (isImage) {
          incomingMedia.img.src = currentVideoUrl;
          incomingMedia.img.style.display = 'block';
          incomingMedia.video.style.display = 'none';
          incomingMedia.video.pause();
        } else {
          incomingMedia.video.src = currentVideoUrl;
          incomingMedia.video.currentTime = 0;
          incomingMedia.video.style.display = 'block';
          incomingMedia.img.style.display = 'none';
        }

        if (window.audienceMediaFadeTimeout) {
          clearTimeout(window.audienceMediaFadeTimeout);
        }

        const performCrossfade = () => {
          if (mediaMode === 'cut') {
            incomingEl.style.transition = 'opacity 0s';
            outgoingEl.style.transition = 'opacity 0s';
            outgoingMedia.video.pause();
          } else {
            incomingEl.style.transition = `opacity ${dur}ms ease-in-out`;
            outgoingEl.style.transition = `opacity ${dur}ms ease-in-out`;
            window.audienceMediaFadeTimeout = setTimeout(() => {
              outgoingMedia.video.pause();
            }, dur + 50);
          }
          incomingEl.style.opacity = '1';
          outgoingEl.style.opacity = '0';
        };

        if (isImage) {
          performCrossfade();
        } else {
          incomingMedia.video.play()
            .then(() => performCrossfade())
            .catch(() => performCrossfade());
        }
      }

      // 3. Lower Third Overlay Layer
      if (!state.isOverlayCleared && state.isLowerThirdActive) {
        ltTitle.textContent = state.lowerThirdText;
        ltSub.textContent = state.lowerThirdSubtext;
        ltBanner.classList.add('active');
      } else {
        ltBanner.classList.remove('active');
      }
    });

    sync.requestState();
  </script>
</body>
</html>
